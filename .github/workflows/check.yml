name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Static checks of the desktop layer
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/check.py -v
